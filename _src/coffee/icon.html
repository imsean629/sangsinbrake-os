<html><head><meta charset=utf-8><style>
body{margin:0;background:transparent}
.i{width:512px;height:512px;position:relative;overflow:hidden;background:#fff}
.i.r{border-radius:112px}
.bar1{position:absolute;left:0;right:0;top:0;height:86px;background:#E60012}
.bar2{position:absolute;left:0;right:0;bottom:0;height:86px;background:#003C96}
.cup{position:absolute;left:50%;transform:translateX(-50%);top:132px;width:228px;height:258px}
.g{position:absolute;inset:0;border:15px solid #231815;border-top:0;border-radius:8px 8px 76px 76px;overflow:hidden;clip-path:polygon(0 0,100% 0,90% 100%,10% 100%)}
.q{position:absolute;left:0;right:0;bottom:0;height:72%;background:linear-gradient(to top,#4A2817,#6E3C22 65%,#A06C42)}
.q::after{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#E9CFA6}
.sb{position:absolute;left:0;right:0;top:44px;text-align:center;color:#F6E7CD;font:900 88px/1 'Noto Sans CJK KR',sans-serif;letter-spacing:-3px}
.rim{position:absolute;left:-7%;right:-7%;top:-10px;height:22px;border-radius:11px;background:#231815}
</style></head><body>
<div class="i" id="sq"><div class=bar1></div><div class=bar2></div><div class=cup><div class=g><div class=q><div class=sb>SB</div></div></div><div class=rim></div></div></div>
</body></html>
